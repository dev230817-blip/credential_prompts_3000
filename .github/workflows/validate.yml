name: Validate releases

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install imaging release dependencies
        run: python -m pip install -r releases/20261020_v1/requirements.txt
      - name: Validate imaging release and run regression tests
        working-directory: releases/20261020_v1
        run: |
          python -B -X utf8 src/validate_release.py --repo .
          python -B -X utf8 src/verify_hashes.py --repo .
          python -B -X utf8 -m unittest discover -s tests -v
      - name: Validate archived release
        working-directory: releases/20261011_v4
        run: |
          python -B -X utf8 src/validate_release.py --repo . --report-dir "$RUNNER_TEMP/legacy-validation"
          python -B -X utf8 src/verify_hashes.py --repo .
          python -B -X utf8 -m unittest discover -s tests -v
